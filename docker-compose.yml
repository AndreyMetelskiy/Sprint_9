version: '3.8'

services:
  selenoid:
    image: "aerokube/selenoid"
    container_name: selenoid
    ports:
      - "4444:4444"
    networks:
      - selenoid
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Подставляем ваше имя файла конфигурации (browsers.json) вместо config.json
      - "./browsers.json:/etc/selenoid/config.json"
    command: ["-conf", "/etc/selenoid/config.json", "-container-network", "selenoid"]

  selenoid-ui:
    image: "aerokube/selenoid-ui:latest"
    container_name: selenoid-ui
    links:
      - selenoid
    ports:
      - "8081:8080"
    networks:
      - selenoid
    command: ["--selenoid-uri", "http://selenoid:4444"]

  # Переименовали ваш сервис autotests в эталонный test_docker
  test_docker:
    build: .
    container_name: test_docker
    depends_on:
      - selenoid
    networks:
      - selenoid
    tty: true
    # Сохраняем генерацию allure-results, переопределяя команду как в эталоне
    command: ["pytest", "--alluredir=allure-results"]
    volumes:
      - ./allure-results:/app/allure-results

networks:
  selenoid:
    name: selenoid
